name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Runbook allineato ai cataloghi di eventi ed errori
        run: pnpm runbook:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  secrets:
    name: Nessun segreto nel repository (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks su tutta la storia
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner -v

  database:
    name: Migrazioni, seed e smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.98.2
      - run: pnpm install --frozen-lockfile
      - name: Supabase locale (migrazioni e seed; Storage per i loghi, Mailpit per gli inviti)
        run: supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm test:smoke

  e2e:
    name: Test end-to-end del web pubblico e dell'app esercente (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.98.2
      - run: pnpm install --frozen-lockfile
      - name: Supabase locale
        run: supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Chromium per Playwright
        run: pnpm --filter @loyalty/web exec playwright install --with-deps chromium
      - name: Build di produzione e test end-to-end (OTP di prova, chiavi di prova di Turnstile)
        run: pnpm e2e
      - name: Rapporto Playwright e log del server (se fallisce)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e-logs
            apps/merchant/playwright-report
            apps/merchant/test-results
            apps/merchant/e2e-logs
          retention-days: 7

  sourcemaps:
    name: Source map della web app esercente su Sentry
    # solo su main e solo se il token è configurato (Settings → Secrets: SENTRY_AUTH_TOKEN;
    # Variables: SENTRY_ORG, SENTRY_PROJECT). Le build native le caricano da EAS.
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Token Sentry non configurato
        if: env.SENTRY_AUTH_TOKEN == ''
        run: echo "SENTRY_AUTH_TOKEN non configurato, caricamento delle source map saltato."
      - uses: actions/checkout@v7
        if: env.SENTRY_AUTH_TOKEN != ''
      - uses: pnpm/action-setup@v6
        if: env.SENTRY_AUTH_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.SENTRY_AUTH_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.SENTRY_AUTH_TOKEN != ''
      - name: Export web con source map e caricamento (Debug ID già nel bundle grazie a Metro + Sentry)
        if: env.SENTRY_AUTH_TOKEN != ''
        run: pnpm --filter @loyalty/merchant sourcemaps:web
